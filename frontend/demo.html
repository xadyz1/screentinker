<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwiftDisplay Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Arimo', -apple-system, sans-serif; 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      color: #f8fafc; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .demo-container {
      text-align: center;
      max-width: 100%;
      padding: 2rem;
    }
    .logo { width: 120px; margin-bottom: 1.5rem; }
    h1 { font-family: 'Bakbak One', sans-serif; font-size: 2.5rem; margin-bottom: 0.5rem; background: linear-gradient(90deg, #3b82f6, #f97316); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 2rem; }
    .features { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 2rem; }
    .feature { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 1rem 1.5rem; border-radius: 0.75rem; font-size: 0.9rem; }
    .feature i { color: #f97316; margin-right: 0.5rem; }
    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .features { flex-direction: column; align-items: center; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;700&family=Bakbak+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="demo-container">
    <img src="/assets/swiftdisplaylogo.png" alt="SwiftDisplay" class="logo">
    <h1>SwiftDisplay</h1>
    <p>Your digital signage content would appear here</p>
    <div class="features">
      <div class="feature"><i class="fa-solid fa-images"></i> Images & Slideshows</div>
      <div class="feature"><i class="fa-solid fa-video"></i> Video Playback</div>
      <div class="feature"><i class="fa-solid fa-clock"></i> Scheduling</div>
      <div class="feature"><i class="fa-solid fa-cloud"></i> Remote Management</div>
    </div>
  </div>
</body>
</html>
